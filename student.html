
<!DOCTYPE html>
<html>
<head>
<title>Student Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
<h1>Student Portal</h1>
<p>Manage consent and personal wellness data.</p>

<h2>Consent Status</h2>
<button onclick="toggleConsent()">Toggle Consent</button>
<p id="status"></p>

<h2>Download Data</h2>
<button onclick="downloadData()">Download JSON</button>

<h2>Delete Data</h2>
<button onclick="deleteData()">Delete Records</button>

<br><br>
<a class="button" href="index.html">Back</a>
</div>

<script>
let consent = localStorage.getItem("consent") || "Granted";
document.getElementById("status").innerText = consent;

function toggleConsent(){
consent = consent === "Granted" ? "Withdrawn" : "Granted";
localStorage.setItem("consent", consent);
document.getElementById("status").innerText = consent;
}

function downloadData(){
const data = {
student:"Demo Student",
consent:consent
};
const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url = URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="student_data.json";
a.click();
}

function deleteData(){
localStorage.clear();
alert("Data deleted");
}
</script>
</body>
</html>
