<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCWIS Platform</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef6ff, #f8f3ff);
      color: #0b1533;
      overflow-x: hidden;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 60px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #1f2d7a;
    }

    .menu {
      display: flex;
      gap: 40px;
      font-weight: 600;
      color: #475569;
    }

    .hero {
      padding: 100px 80px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .hero h1 {
      font-size: 84px;
      line-height: 0.95;
      margin-bottom: 30px;
      font-weight: 900;
    }

    .hero p {
      font-size: 24px;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btns {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 18px 34px;
      border-radius: 18px;
      font-size: 18px;
</html>
